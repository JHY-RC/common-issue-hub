<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>共性问题平台</title><link rel="stylesheet" href="/app.css"><link rel="stylesheet" href="/overrides.css"></head>
<body><aside><div class="brand"><span>◈</span><div>共性问题平台<small>版本风险，一目了然</small></div></div><nav><button class="nav active" data-view="dashboard">概览</button><button class="nav" data-view="matrix">问题状态</button><button class="nav" data-view="manage">基础资料</button></nav><div class="side-bottom">本地数据模式<br><small>请定期导出备份</small></div></aside>
<main><header><div><p class="eyebrow">COMMON ISSUE HUB</p><h1 id="page-title">版本概览</h1></div><div class="actions"><a class="button ghost" href="/api/export.csv">导出备份</a><button class="button" id="quick-issue">+ 录入问题</button></div></header>
<section id="dashboard" class="view active"><div class="empty hero"><div><p class="eyebrow">从版本关系开始</p><h2>把重复表格变成<br>清晰的版本决策</h2><p>建立软件产品、版本分支与机台型号后，即可追踪每一个共性问题的合并和发布状态。</p><button class="button" id="start-setup">开始建立基础资料</button></div><div class="hero-art"><b>V1.2</b><i></i><b>V1.3</b><i class="branch"></i><b>V1.1.2</b></div></div><div id="dashboard-content" hidden></div></section>
<section id="matrix" class="view"><div class="toolbar"><label>软件产品<select id="matrix-product"></select></label><label>版本分支<select id="matrix-version"></select></label><label>机台型号<select id="matrix-machine"></select></label><button class="button" id="load-matrix">查看状态</button></div><div id="matrix-content" class="empty compact">请选择版本分支和机台型号，查看问题状态。</div></section>
<section id="manage" class="view"><div class="manage-grid"><article><h2>软件产品</h2><form id="product-form"><input name="name" required placeholder="例如：A7 软件"><button class="button">新增</button></form><div id="products-list" class="list"></div></article><article><h2>版本分支</h2><form id="version-form"><select name="productId" required></select><input name="name" required placeholder="例如：V1.3"><select name="parentId"><option value="">无父版本（根分支）</option></select><input name="note" placeholder="可选说明"><button class="button">新增版本</button></form><div id="versions-list" class="list"></div></article><article><h2>机台型号</h2><form id="machine-form"><select name="productId" required></select><input name="name" required placeholder="例如：Phoenix PLUS B35"><input name="note" placeholder="可选说明"><button class="button">新增机台</button></form><div id="machines-list" class="list"></div></article><article><h2>共性问题 / 需求</h2><form id="issue-form"><select name="productId" required></select><select name="category"><option>共性问题</option><option>共性需求</option></select><textarea name="description" required placeholder="描述问题、影响和处理要求"></textarea><button class="button">录入</button></form><div id="issues-list" class="list"></div></article></div></section>
</main><dialog id="state-dialog"><form method="dialog" id="state-form"><div class="dialog-head"><div><p class="eyebrow">更新状态</p><h2 id="state-title"></h2></div><button class="icon" value="cancel">×</button></div><input type="hidden" name="issueId"><input type="hidden" name="versionId"><input type="hidden" name="machineId"><label>修改状态<select name="changeStatus"><option value="unmerged">未合并</option><option value="modified">已修改</option><option value="not_applicable">不涉及</option></select></label><label>发布状态<select name="releaseStatus"><option value="not_released">未发布</option><option value="released">已发布</option></select></label><label>发布的软件版本<input name="releaseVersion" placeholder="例如：4.3.35-SM10-02"></label><label>备注<textarea name="note" placeholder="补充说明（可选）"></textarea></label><div class="dialog-actions"><button value="cancel" class="button ghost">取消</button><button class="button" id="save-state">保存变更</button></div></form></dialog><dialog id="edit-dialog"><form method="dialog" id="edit-form"><div class="dialog-head"><div><p class="eyebrow">编辑资料</p><h2 id="edit-title"></h2></div><button class="icon" value="cancel">×</button></div><div id="edit-fields"></div><div class="dialog-actions"><button value="cancel" class="button ghost">取消</button><button class="button">保存修改</button></div></form></dialog><div id="toast"></div><script type="module" src="/app.js"></script></body></html>
